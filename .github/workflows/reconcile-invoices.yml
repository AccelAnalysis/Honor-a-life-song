name: Publish verified lifecycle reconciliation
on:
  push:
    branches: [feature/organization-to-individual-lifecycle]
    paths: [.github/workflows/reconcile-invoices.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish-verified-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: reconciled-release-evidence
          run-id: 33920561196
          github-token: ${{ github.token }}
          path: /tmp/verified-evidence
      - name: Reconstruct checksum-verified source already tested by run 33920561196
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, shutil, subprocess
          root = pathlib.Path.cwd()
          evidence = pathlib.Path('/tmp/verified-evidence')
          hashes = json.loads((evidence / 'release-source-hashes.json').read_text())
          assert '# pass 25' in (evidence / 'release-integration-tests.log').read_text()
          assert '# fail 0' in (evidence / 'release-integration-tests.log').read_text()
          assert '# pass 10' in (evidence / 'release-native-tests.log').read_text()
          assert '144 passed' in (evidence / 'release-app-tests.log').read_text()
          assert 'Generating static pages (564/564)' in (evidence / 'release-build.log').read_text()
          encoded = ''.join((root / '.release-transport' / f'part{i}.txt').read_text().strip() for i in range(1, 9))
          packed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(packed).hexdigest() == '7a3ae66735579cfc604d3a45cb38c6dcb16ac903130d152049a86997e01f2192'
          bundle = json.loads(lzma.decompress(packed))
          assert hashes == {name: entry['hash'] for name, entry in bundle['files'].items()}
          def safe_path(name):
              relative = pathlib.PurePosixPath(name)
              assert not relative.is_absolute() and '..' not in relative.parts and '.git' not in relative.parts
              return root / relative
          for name, entry in bundle['files'].items():
              target = safe_path(name)
              if 'content' in entry:
                  text = entry['content']
              else:
                  source = subprocess.check_output(['git', 'show', bundle['refs'][entry['base']] + ':' + name])
                  assert hashlib.sha256(source).hexdigest() == entry['baseHash']
                  lines = source.decode('utf-8').splitlines(keepends=True)
                  for start, end, replacement in reversed(entry['edits']):
                      lines[start:end] = [replacement]
                  text = ''.join(lines)
              data = text.encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == entry['hash'], name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          for name in bundle['delete']:
              safe_path(name).unlink(missing_ok=True)
          shutil.rmtree(root / '.release-transport')
          # Workflow files are applied separately through the authorized repository connector.
          shutil.rmtree(root / '.github' / 'workflows')
          subprocess.run(['git', 'restore', '--source=HEAD', '--staged', '--worktree', '.github/workflows'], check=True)
          for name, expected in hashes.items():
              if not name.startswith('.github/workflows/'):
                  assert hashlib.sha256(safe_path(name).read_bytes()).hexdigest() == expected, name
          PY
      - uses: actions/download-artifact@v4
        with:
          name: songkeep-verification-dependencies
          run-id: 33916510749
          github-token: ${{ github.token }}
          path: /tmp/songkeep-locked-dependencies
      - name: Publish the verified application source without changing workflows
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          tar -xzf /tmp/songkeep-locked-dependencies/dependencies.tar.gz package-lock.json functions/package-lock.json
          echo 'ba6781f8eb6e218e11188a5f807c8b03a6c6ca44f3c86da3e887f510ade99972  package-lock.json' | sha256sum --check
          echo 'bcc594c566653746ada6cfeb89015d2872a6542782da92ea3c156b5073c4df3b  functions/package-lock.json' | sha256sum --check
          test "$(git ls-remote origin refs/heads/feature/organization-to-individual-lifecycle | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code -- .github/workflows
          git diff --cached --check
          git commit -m 'feat: reconcile PR 21 and implement native invoice lifecycle'
          git push origin HEAD:feature/organization-to-individual-lifecycle
          git rev-parse HEAD | tee /tmp/release-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reconciliation-publish-result
          path: /tmp/release-commit.txt
          retention-days: 7
