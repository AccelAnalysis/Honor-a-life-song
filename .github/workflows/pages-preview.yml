name: pages-preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-preview-build-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve preview base path
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            preview_path="pr-${{ github.event.pull_request.number }}"
            base_path="/${{ github.event.repository.name }}/${preview_path}"
          else
            preview_path=""
            base_path="/${{ github.event.repository.name }}"
          fi

          echo "HALS_PREVIEW_PATH=${preview_path}" >> "$GITHUB_ENV"
          echo "PAGES_BASE_PATH=${base_path}" >> "$GITHUB_ENV"

      - name: Load SongKeep Firebase web configuration
        shell: bash
        run: |
          set -euo pipefail

          config_file="$(mktemp)"
          curl --fail --silent --show-error --retry 3 \
            "https://songify-cc2c5.web.app/__/firebase/init.json" \
            --output "${config_file}"

          project_id="$(jq -r '.projectId // empty' "${config_file}")"
          app_id="$(jq -r '.appId // empty' "${config_file}")"
          api_key="$(jq -r '.apiKey // empty' "${config_file}")"
          auth_domain="$(jq -r '.authDomain // empty' "${config_file}")"
          storage_bucket="$(jq -r '.storageBucket // empty' "${config_file}")"
          sender_id="$(jq -r '.messagingSenderId // empty' "${config_file}")"
          measurement_id="$(jq -r '.measurementId // empty' "${config_file}")"

          if [[ "${project_id}" != "songify-cc2c5" || "${app_id}" != "1:471693809116:web:e13d6b10bd310bd78aeb19" ]]; then
            echo "Firebase Hosting returned configuration for an unexpected app." >&2
            exit 1
          fi

          if [[ -z "${api_key}" || -z "${auth_domain}" ]]; then
            echo "Firebase Hosting did not return the required Web SDK configuration." >&2
            exit 1
          fi

          {
            echo "NEXT_PUBLIC_FIREBASE_API_KEY=${api_key}"
            echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${auth_domain}"
            echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${project_id}"
            echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${storage_bucket}"
            echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${sender_id}"
            echo "NEXT_PUBLIC_FIREBASE_APP_ID=${app_id}"
            if [[ -n "${measurement_id}" ]]; then
              echo "NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${measurement_id}"
            fi
          } >> "$GITHUB_ENV"

      - name: Build static Pages preview
        run: npm run build
        env:
          HALS_PAGES_PREVIEW: "1"
          PAGES_BASE_PATH: ${{ env.PAGES_BASE_PATH }}

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-preview-site
          path: ./out
          if-no-files-found: error
          retention-days: 7

      - name: Record preview target
        shell: bash
        run: |
          root="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          if [[ -n "${HALS_PREVIEW_PATH}" ]]; then
            echo "### Preview target" >> "$GITHUB_STEP_SUMMARY"
            echo "${root}/${HALS_PREVIEW_PATH}/" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Main Pages target" >> "$GITHUB_STEP_SUMMARY"
            echo "${root}/" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Firebase Web SDK configuration is loaded from the linked SongKeep Firebase Hosting app at build time, so account creation and sign-in can use the production Firebase client. Payments, messaging, storage fulfillment and other server-backed services remain separate deployment concerns." >> "$GITHUB_STEP_SUMMARY"
