name: Complete presentation contrast
on:
  push:
    branches: [design/hig-customer-pipeline-presentation]
    paths: [.github/workflows/presentation-source.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply appearance-specific foregrounds
        run: |
          python3 - <<'PY'
          import pathlib
          path = pathlib.Path('public/presentations/songkeep-customer-pipeline.html')
          html = path.read_text()
          assert '--stage-foreground' in html and html.count('class="slide"') == 24
          html = html.replace('*{box-sizing:border-box}', '.slide,[style*="--stage"]{--stage-foreground:color-mix(in srgb,var(--stage) 82%,black)}\n*{box-sizing:border-box}')
          html = html.replace('.stage-badge,.choice-number,.metric-mark,.activity-number,.menu-stage-number{background:', '.stage-badge,.choice-number,.metric-mark,.activity-number,.menu-stage-number,.gate-node span{background:')
          path.write_text('\n'.join(line.rstrip() for line in html.splitlines())+'\n')
          PY
      - name: Publish presentation fix
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/design/hig-customer-pipeline-presentation | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/presentations/songkeep-customer-pipeline.html
          git diff --cached --check
          git commit -m 'fix: accessible stage foregrounds on badges, outcomes and handoffs'
          git push origin HEAD:design/hig-customer-pipeline-presentation
