name: Reconcile lifecycle and invoices
on:
  push:
    branches: [feature/organization-to-individual-lifecycle]
    paths: [.github/workflows/reconcile-invoices.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare verification dependencies without application secrets
        run: |
          npm install --no-audit --no-fund
          mkdir -p functions
          cat > functions/package.json <<'JSON'
          {"name":"songkeep-services","private":true,"main":"index.js","engines":{"node":"22"},"scripts":{"test":"node --test test/domain.test.js","test:integration":"node --test test/integration.test.js"},"dependencies":{"firebase-admin":"^13.0.0","firebase-functions":"^6.0.0","pdfkit":"^0.17.0","stripe":"^18.0.0","@fontsource/manrope":"^5.2.0"},"devDependencies":{"@firebase/rules-unit-testing":"^5.0.0","firebase":"^12.18.0"}}
          JSON
          npm --prefix functions install --no-audit --no-fund
          mkdir -p /tmp/dependencies
          tar -czf /tmp/dependencies/dependencies.tar.gz node_modules functions/node_modules package-lock.json functions/package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: songkeep-verification-dependencies
          path: /tmp/dependencies
          retention-days: 1
