name: Coordinated PR source review
on:
  push:
    branches: [feature/account-first-customer-experience]
    paths: [.github/workflows/ui-source-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export source history without credentials or runtime data
        run: |
          mkdir -p /tmp/songkeep-review
          git bundle create /tmp/songkeep-review/repository.bundle HEAD refs/remotes/origin/main refs/remotes/origin/design/hig-customer-pipeline-presentation refs/remotes/origin/feature/account-first-customer-experience
          git rev-parse HEAD > /tmp/songkeep-review/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: songkeep-coordinated-pr-source
          path: /tmp/songkeep-review
          retention-days: 2
