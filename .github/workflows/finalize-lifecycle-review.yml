name: Finalize lifecycle review fixes

on:
  push:
    branches:
      - feature/organization-to-individual-lifecycle
    paths:
      - .finalize-lifecycle-review

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes when needed
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "Resume secure payment" components/organization-relationship.tsx \
            && grep -q "currentAccessConsentIsActive" firestore.rules \
            && grep -q "runTransaction" lib/firebase/customer-lifecycle.ts; then
            echo "Review fixes already present."
            exit 0
          fi

          test -f .github/workflows/fix-lifecycle-review.yml
          awk '/^[[:space:]]*python - <<.PY./{capture=1; next} capture && /^[[:space:]]*PY$/{exit} capture{sub(/^          /, ""); print}' \
            .github/workflows/fix-lifecycle-review.yml > /tmp/lifecycle-fix.py
          python /tmp/lifecycle-fix.py

          grep -q "Resume secure payment" components/organization-relationship.tsx
          grep -q "currentAccessConsentIsActive" firestore.rules
          grep -q "validExperienceRequestSupersede" firestore.rules
          grep -q "permissionInvitationId?: string" lib/firebase/organization-account.ts

      - name: Verify application
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Commit verified result
        shell: bash
        run: |
          rm -f .lifecycle-review-fix .diagnose-lifecycle-review .finalize-lifecycle-review .lifecycle-review-diagnostic.log
          rm -f .github/workflows/fix-lifecycle-review.yml
          rm -f .github/workflows/diagnose-and-apply-lifecycle-review.yml
          rm -f .github/workflows/finalize-lifecycle-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: make lifecycle transitions atomic and recoverable"
            git push
          fi
          gh pr comment 24 --body "✅ Final lifecycle review gate passed: atomic payment conversion, atomic consent approval, package-request supersession, current consent/entitlement purchase checks, family-email validation, resumable checkout, lint, TypeScript, all tests, and the production build."
