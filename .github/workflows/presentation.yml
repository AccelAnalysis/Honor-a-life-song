name: Presentation accessibility
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  presentation-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser test tool
        run: |
          npm install --prefix /tmp/songkeep-presentation --save-exact --no-audit --no-fund @playwright/test@1.63.0
          /tmp/songkeep-presentation/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify slides, contrast, keyboard controls and responsive layout
        env:
          NODE_PATH: /tmp/songkeep-presentation/node_modules
          SONGKEEP_PRESENTATION_OUTPUT: /tmp/songkeep-presentation-results
        run: |
          mkdir -p /tmp/songkeep-presentation-results
          set -o pipefail
          node e2e/presentation.cjs 2>&1 | tee /tmp/songkeep-presentation-results/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presentation-accessibility-evidence
          path: /tmp/songkeep-presentation-results
          retention-days: 7
