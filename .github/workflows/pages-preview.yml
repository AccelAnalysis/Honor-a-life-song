name: pages-preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-preview-build-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve preview base path
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            preview_path="pr-${{ github.event.pull_request.number }}"
            base_path="/${{ github.event.repository.name }}/${preview_path}"
          else
            preview_path=""
            base_path="/${{ github.event.repository.name }}"
          fi

          echo "HALS_PREVIEW_PATH=${preview_path}" >> "$GITHUB_ENV"
          echo "PAGES_BASE_PATH=${base_path}" >> "$GITHUB_ENV"

      # Firebase Web SDK configuration is public browser configuration. Keep it
      # restricted to trusted main/manual builds so unreviewed PR JavaScript on
      # the same Pages origin cannot inherit a reviewer's production Firebase session.
      - name: Configure SongKeep Firebase web app
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          {
            echo "NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyD5f4TF_sXVV-C8aFWpkTG0qMtACE3O_VY"
            echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=songify-cc2c5.firebaseapp.com"
            echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=songify-cc2c5"
            echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=songify-cc2c5.firebasestorage.app"
            echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=471693809116"
            echo "NEXT_PUBLIC_FIREBASE_APP_ID=1:471693809116:web:e13d6b10bd310bd78aeb19"
            echo "NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=G-NP4ZD25M79"
          } >> "$GITHUB_ENV"

      - name: Build static Pages preview
        run: npm run build
        env:
          HALS_PAGES_PREVIEW: "1"
          PAGES_BASE_PATH: ${{ env.PAGES_BASE_PATH }}

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-preview-site
          path: ./out
          if-no-files-found: error
          retention-days: 7

      - name: Record preview target
        shell: bash
        run: |
          root="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          if [[ -n "${HALS_PREVIEW_PATH}" ]]; then
            echo "### Preview target" >> "$GITHUB_STEP_SUMMARY"
            echo "${root}/${HALS_PREVIEW_PATH}/" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Pull-request previews intentionally do not receive the production Firebase client configuration." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Main Pages target" >> "$GITHUB_STEP_SUMMARY"
            echo "${root}/" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The registered SongKeep Firebase Web SDK configuration is embedded at build time so account creation and sign-in can use the production Firebase client. Payments, messaging, storage fulfillment and other server-backed services remain separate deployment concerns." >> "$GITHUB_STEP_SUMMARY"
          fi
