name: Reconcile lifecycle and invoices
on:
  push:
    branches: [feature/organization-to-individual-lifecycle]
    paths: [.github/workflows/reconcile-invoices.yml]
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download official Firestore test runtime
        run: |
          mkdir -p /tmp/emulator
          curl --fail --location --retry 3 https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.22.0.jar -o /tmp/emulator/firestore-emulator.jar
          echo '9b6498b7f62714d67f48f59b3818883cd682dbcd46b9f59511de81c97bb5166c  /tmp/emulator/firestore-emulator.jar' | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: songkeep-firestore-emulator
          path: /tmp/emulator
          retention-days: 1
