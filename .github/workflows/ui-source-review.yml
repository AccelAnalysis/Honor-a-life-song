name: Customer experience source review
on:
  push:
    branches: [feature/account-first-customer-experience]
    paths: [.github/workflows/ui-source-review.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated official test tools
        run: |
          mkdir -p /tmp/browser-tools /tmp/source-review
          cd /tmp/browser-tools
          npm init -y >/dev/null
          npm install --save-exact firebase-tools@15 @playwright/test@1 --no-audit --no-fund
          tar -czf /tmp/source-review/test-tools.tar.gz package.json package-lock.json node_modules
      - name: Check public Firebase hosting setup
        run: |
          curl -L --max-time 15 -s -w '\nHTTP %{http_code}\n' https://songify-cc2c5.web.app/__/firebase/init.json > /tmp/source-review/hosting-public-setup.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: songkeep-browser-test-tools
          path: /tmp/source-review
          retention-days: 2
