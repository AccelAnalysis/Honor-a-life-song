name: Reconcile canonical team roles
on:
  push:
    branches: [feature/account-first-customer-experience]
    paths: [.github/workflows/finish-team-roles.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact reviewed role-contract edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path); text = p.read_text()
              assert text.count(old) == 1, (path, old)
              p.write_text(text.replace(old, new))
          team = 'components/organization-team.tsx'
          replace(team, 'import type { OrganizationMember, OrganizationMemberRole }', 'import type { OrganizationMember }')
          replace(team, 'const roleLabels: Record<string, string> = { organization_admin: "Administrator", coordinator: "Event coordinator", viewer: "View only" };', 'import { organizationRoleLabel, organizationRoleOptions, parseOrganizationRole } from "@/domain/organization-roles";')
          replace(team, 'role: String(values.get("role") ?? "viewer") as OrganizationMemberRole', 'role: parseOrganizationRole(String(values.get("role") ?? "viewer"))')
          replace(team, 'roleLabels[member.role] ?? "Team member"', 'organizationRoleLabel(member.role)')
          replace(team, 'roleLabels[item.role]', 'organizationRoleLabel(item.role)')
          replace(team, '<option value="viewer">View only</option><option value="coordinator">Event coordinator</option><option value="organization_admin">Administrator</option>', '{organizationRoleOptions.map(option => <option key={option.value} value={option.value}>{option.label}</option>)}')
          page = 'components/organization-relationship.tsx'
          replace(page, 'import { OrganizationTeam }', 'import { canManageExperiencePeople } from "@/domain/organization-roles";\nimport { OrganizationTeam }')
          replace(page, '["organization_admin", "coordinator"].includes(organization?.membershipRole ?? "")', 'canManageExperiencePeople(organization?.membershipRole)')
          profile = 'domain/customer-lifecycle.ts'
          replace(profile, 'import type { ConsentScope }', 'import type { OrganizationMemberRole } from "./organization-account";\nimport type { ConsentScope }')
          replace(profile, 'membershipRole?: "organization_admin" | "coordinator" | "viewer";', 'membershipRole?: OrganizationMemberRole;')
          invitation = 'components/accept-invitation-route.tsx'
          replace(invitation, 'import { customerMessage }', 'import { organizationRoleLabel } from "@/domain/organization-roles";\nimport { customerMessage }')
          replace(invitation, 'invitation.role.replaceAll("_", " ")', 'organizationRoleLabel(invitation.role)')
          e2e = 'e2e/account-first.cjs'
          marker = "  await check('Group photography loads, crossfades, pauses and respects reduced motion', async () => {"
          insert = "  await check('Canonical coordinator roles can manage people without purchasing authority', async () => {\n   await require('./team-roles.cjs').verifyTeamRoles({page,browser,db,auth,orgId,password,output});\n  });\n"
          replace(e2e, marker, insert + marker)
          PY
      - name: Check source and tests before publishing
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test
      - name: Publish only reviewed source edits
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/feature/account-first-customer-experience | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/organization-team.tsx components/organization-relationship.tsx components/accept-invitation-route.tsx domain/customer-lifecycle.ts e2e/account-first.cjs
          git diff --cached --check
          git commit -m 'fix: canonical organization team roles and coordinator participant controls'
          git push origin HEAD:feature/account-first-customer-experience
