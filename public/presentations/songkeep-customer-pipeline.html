<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SongKeep Customer Pipeline</title><body><script>
(async()=>{const urls=[1,2,3,4,5,6].map(i=>`songkeep-customer-pipeline.part${i}.txt`);const b64=(await Promise.all(urls.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`Unable to load ${u}`);return r.text()}))).join('').replace(/\s+/g,'');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close();})().catch(err=>{document.body.innerHTML=`<main style="font-family:system-ui;padding:40px"><h1>SongKeep Customer Pipeline</h1><p>The presentation could not load.</p><pre>${String(err)}</pre></main>`});
</script></body>
